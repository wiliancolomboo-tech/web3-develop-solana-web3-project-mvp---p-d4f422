version: '3.8'

services:
  telemetry-daemon:
    build:
      context: ./daemon
      dockerfile: Dockerfile
    restart: always
    environment:
      - SOLANA_RPC_HTTP=https://api.devnet.solana.com
      - SOLANA_RPC_WS=wss://api.devnet.solana.com
      - PROGRAM_ID=V1bE5tReAm111111111111111111111111111111111
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_test_000000000000000000000000
      - NOTIFICATION_EMAIL=grants@vibestream.io
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"