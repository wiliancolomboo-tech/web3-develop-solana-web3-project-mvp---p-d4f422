version: "3.8"

services:
  vibestream-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibestream-enterprise-worker
    restart: always
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=V1beS1ream111111111111111111111111111111111
      - RESEND_API_KEY=re_test_000000000000000000000000
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - NOTIFICATION_SENDER_EMAIL=grants@vibestream.org
      - NOTIFICATION_ADMIN_EMAIL=committee@vibestream.org
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"